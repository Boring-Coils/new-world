<svg viewBox="0 0 680 940" xmlns="http://www.w3.org/2000/svg">
  <style>
    .bg{fill:#fbfcfe}
    .title{font-family:sans-serif;font-size:22px;font-weight:700;fill:#12263f}
    .subtitle{font-family:sans-serif;font-size:10.5px;fill:#5f7187}
    .group{fill:#ffffff;stroke:#c8d1dd;stroke-width:1.2;stroke-dasharray:6 3}
    .layer-tag{fill:#eef2f7;stroke:#c8d1dd;stroke-width:1}
    .layer-label{font-family:sans-serif;font-size:11px;font-weight:600;fill:#42546b;text-anchor:middle}
    .c1{fill:#edf5ff;stroke:#6f9fcf;stroke-width:1.4}
    .c2{fill:#fff5e6;stroke:#d3a35d;stroke-width:1.4}
    .c3{fill:#eaf8f3;stroke:#62a98e;stroke-width:1.4}
    .c4{fill:#f2efff;stroke:#917dc8;stroke-width:1.4}
    .node-title{font-family:sans-serif;font-weight:600;fill:#18324c;text-anchor:middle}
    .node-sub{font-family:sans-serif;font-weight:400;fill:#526980;text-anchor:middle}
    .edge{stroke:#7f8c9d;stroke-width:1.8;fill:none;marker-end:url(#arrow)}
    .label-bg{fill:#ffffff}
    .edge-label{font-family:sans-serif;font-size:9.2px;fill:#607184;text-anchor:middle}
    .legend{fill:#f3f6f9;stroke:#c8d1dd;stroke-width:1}
    .legend-text{font-family:sans-serif;font-size:9.5px;fill:#52657b}
    .footer{font-family:sans-serif;font-size:8.8px;fill:#76869a}
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M1 2L8 5L1 8" fill="none" stroke="#7f8c9d" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="680" height="940"/>
  <text class="title" x="32" y="34">New World · 当前运行时架构</text>
  <text class="subtitle" x="32" y="56">Godot 4.7 / v0.0.1.5 · 场景组合 → 逐刻模拟 → 居民组件 → 共享服务与数据</text>

  <rect class="group" x="24" y="80" width="632" height="150" rx="10"/>
  <rect class="layer-tag" x="36" y="96" width="180" height="24" rx="12"/>
  <text class="layer-label" x="126" y="112" font-size="11">01 场景与交互层</text>

  <rect class="c1" x="36" y="132" width="140" height="78" rx="7"/>
  <text class="node-title" x="106" y="158" font-size="12">World 场景根</text>
  <text class="node-sub" x="106" y="176" font-size="9.5">Colony / TestScene</text>
  <text class="node-sub" x="106" y="192" font-size="8.8">场景组合与生命周期</text>

  <rect class="c1" x="192" y="132" width="140" height="78" rx="7"/>
  <text class="node-title" x="262" y="158" font-size="12">建造与交互</text>
  <text class="node-sub" x="262" y="176" font-size="9.2">DebugUI + Placement</text>
  <text class="node-sub" x="262" y="192" font-size="8.8">预览 · 校验 · 提交</text>

  <rect class="c1" x="348" y="132" width="140" height="78" rx="7"/>
  <text class="node-title" x="418" y="158" font-size="12">世界表现</text>
  <text class="node-sub" x="418" y="176" font-size="9.5">CameraRig</text>
  <text class="node-sub" x="418" y="192" font-size="9.5">GridDisplay</text>

  <rect class="c1" x="504" y="132" width="140" height="78" rx="7"/>
  <text class="node-title" x="574" y="154" font-size="12">状态与详情 UI</text>
  <text class="node-sub" x="574" y="170" font-size="9.2">PlayerStatusBar</text>
  <text class="node-sub" x="574" y="185" font-size="8.6">BuildingDetailPanel</text>
  <text class="node-sub" x="574" y="199" font-size="8.4">事件驱动 / 每刻刷新</text>

