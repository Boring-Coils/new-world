  <rect class="label-bg" x="354" y="243" width="124" height="18" rx="3"/>
  <text class="edge-label" x="416" y="256" font-size="9.2">创建 / 注册实体</text>

  <rect class="group" x="24" y="280" width="632" height="158" rx="10"/>
  <rect class="layer-tag" x="36" y="296" width="180" height="24" rx="12"/>
  <text class="layer-label" x="126" y="312" font-size="11">02 逐刻模拟层</text>

  <rect class="c2" x="48" y="330" width="184" height="94" rx="7"/>
  <text class="node-title" x="140" y="358" font-size="12">TickManager</text>
  <text class="node-sub" x="140" y="376" font-size="9.2">Autoload · 唯一调度器</text>
  <text class="node-sub" x="140" y="392" font-size="9.2">1800 刻/日 · 6 刻/秒</text>
  <text class="node-sub" x="140" y="408" font-size="9.2">建筑 → 居民 → 广播信号</text>

  <rect class="c2" x="248" y="330" width="184" height="94" rx="7"/>
  <text class="node-title" x="340" y="358" font-size="12">Building 建筑</text>
  <text class="node-sub" x="340" y="376" font-size="9.2">Water / Food / Work</text>
  <text class="node-sub" x="340" y="392" font-size="9.2">Warehouse · 雇佣 · 库存</text>
  <text class="node-sub" x="340" y="408" font-size="9.2">放置 / 产出 / 拆除清算</text>

  <rect class="c2" x="448" y="330" width="184" height="94" rx="7"/>
  <text class="node-title" x="540" y="358" font-size="12">Human 居民</text>
  <text class="node-sub" x="540" y="376" font-size="9.2">Buff → 水食 → AI</text>
  <text class="node-sub" x="540" y="392" font-size="9.2">雇主 · 背包 · 站内占用</text>
  <text class="node-sub" x="540" y="408" font-size="9.2">每刻生存结算入口</text>

  <line class="edge" x1="340" y1="446" x2="340" y2="478"/>
  <rect class="label-bg" x="354" y="451" width="124" height="18" rx="3"/>
  <text class="edge-label" x="416" y="464" font-size="9.2">每刻依次 on_tick()</text>

  <rect class="group" x="24" y="488" width="632" height="166" rx="10"/>
  <rect class="layer-tag" x="36" y="504" width="180" height="24" rx="12"/>
  <text class="layer-label" x="126" y="520" font-size="11">03 居民行为组件</text>

  <rect class="c3" x="36" y="538" width="140" height="106" rx="7"/>
  <text class="node-title" x="106" y="562" font-size="12">HumanAI</text>
  <text class="node-sub" x="106" y="580" font-size="9.2">StateChart 状态机</text>
  <text class="node-sub" x="106" y="596" font-size="9">Idle → Traveling</text>
  <text class="node-sub" x="106" y="612" font-size="9">Waiting → Working</text>
  <text class="node-sub" x="106" y="628" font-size="9">离站 / 脱困事件</text>

  <rect class="c3" x="192" y="538" width="140" height="106" rx="7"/>
  <text class="node-title" x="262" y="562" font-size="12">工作事务</text>
  <text class="node-sub" x="262" y="580" font-size="9">HumanWorkBehavior</text>
  <text class="node-sub" x="262" y="596" font-size="9">取料 → 返岗</text>
  <text class="node-sub" x="262" y="612" font-size="9">锁定 → 结算</text>
  <text class="node-sub" x="262" y="628" font-size="9">取消时回滚锁</text>

  <rect class="c3" x="348" y="538" width="140" height="106" rx="7"/>
  <text class="node-title" x="418" y="562" font-size="12">HumanMotion</text>
  <text class="node-sub" x="418" y="580" font-size="9">格子寻路 / 移动</text>
  <text class="node-sub" x="418" y="596" font-size="9">先验路线再离站</text>
  <text class="node-sub" x="418" y="612" font-size="9">被压住时脱困</text>
  <text class="node-sub" x="418" y="628" font-size="9">唯一移动执行者</text>

  <rect class="c3" x="504" y="538" width="140" height="106" rx="7"/>
  <text class="node-title" x="574" y="562" font-size="12">BuffSystem</text>
  <text class="node-sub" x="574" y="580" font-size="9">层数 / 速度倍率</text>
  <text class="node-sub" x="574" y="596" font-size="9">工作闸门取逻辑与</text>
  <text class="node-sub" x="574" y="612" font-size="9">每刻计时 / 到期</text>
  <text class="node-sub" x="574" y="628" font-size="9">消耗倍率叠加</text>

  <line class="edge" x1="340" y1="662" x2="340" y2="694"/>
  <rect class="label-bg" x="354" y="667" width="124" height="18" rx="3"/>
  <text class="edge-label" x="416" y="680" font-size="9.2">服务调用 / 账本写入</text>

  <rect class="group" x="24" y="704" width="632" height="168" rx="10"/>
  <rect class="layer-tag" x="36" y="720" width="210" height="24" rx="12"/>
  <text class="layer-label" x="141" y="736" font-size="11">04 共享服务与数据模型</text>

