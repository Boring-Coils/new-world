  <text class="node-title" x="106" y="785" font-size="12">WorldGridGlobal</text>
  <text class="node-sub" x="106" y="803" font-size="9">Autoload 网格</text>
  <text class="node-sub" x="106" y="819" font-size="9">1000 × 1000 格</text>
  <text class="node-sub" x="106" y="835" font-size="9">坐标 · 占格 · 寻路</text>

  <rect class="c4" x="192" y="754" width="140" height="104" rx="7"/>
  <text class="node-title" x="262" y="785" font-size="12">MaterialSystem</text>
  <text class="node-sub" x="262" y="803" font-size="9">Autoload 账本 · 状态源</text>
  <text class="node-sub" x="262" y="819" font-size="9">锁 / 预留 / 清算</text>
  <text class="node-sub" x="262" y="835" font-size="9">结算前整体试分配</text>

  <rect class="c4" x="348" y="754" width="140" height="104" rx="7"/>
  <text class="node-title" x="418" y="785" font-size="12">Inventory</text>
  <text class="node-sub" x="418" y="803" font-size="9">建筑自带库存</text>
  <text class="node-sub" x="418" y="819" font-size="9">+ CarryBag</text>
  <text class="node-sub" x="418" y="835" font-size="9">物品唯一归属</text>

  <rect class="c4" x="504" y="754" width="140" height="104" rx="7"/>
  <text class="node-title" x="574" y="785" font-size="12">WorkCycle</text>
  <text class="node-sub" x="574" y="803" font-size="9">/ WorkType</text>
  <text class="node-sub" x="574" y="819" font-size="9">需求 · 产出 · 时长</text>
  <text class="node-sub" x="574" y="835" font-size="9">周期状态与产出预留</text>

  <rect class="legend" x="24" y="890" width="632" height="30" rx="6"/>
  <circle cx="42" cy="905" r="4" fill="#6f9fcf"/>
  <text class="legend-text" x="52" y="908.5" font-size="9.5">场景</text>
  <circle cx="92" cy="905" r="4" fill="#d3a35d"/>
  <text class="legend-text" x="102" y="908.5" font-size="9.5">模拟</text>
  <circle cx="142" cy="905" r="4" fill="#62a98e"/>
  <text class="legend-text" x="152" y="908.5" font-size="9.5">居民组件</text>
  <circle cx="224" cy="905" r="4" fill="#917dc8"/>
  <text class="legend-text" x="234" y="908.5" font-size="9.5">共享服务 / 数据</text>
  <line class="edge" x1="356" y1="905" x2="400" y2="905"/>
  <text class="legend-text" x="414" y="908.5" font-size="9.5">调用 / 数据流</text>
  <text class="legend-text" x="510" y="908.5" font-size="9.5">虚线框 = 分层边界</text>

  <text class="footer" x="32" y="932" font-size="8.8">依据 project.godot 与 v0.0.1.5 当前代码；施工、住宅、通用任务与存档仍属后续设计。</text>
</svg>
